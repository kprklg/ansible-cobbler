---
# rebuild.yml — пересобрать patched-образы (после изменения патчей)

- name: Пересборка patched-образов
  hosts: cobbler
  become: true
  gather_facts: true

  roles:
    - role: cobbler
      tasks_from: images

  post_tasks:
    - name: "Перезапуск cobblerd (новый образ)"
      community.docker.docker_compose_v2:
        project_src: "{{ cobbler_workdir }}"
        state: present
        restarted: true
      failed_when: false

    - name: "Готово"
      ansible.builtin.debug:
        msg: "✓ Patched-образы пересобраны и cobblerd перезапущен"
