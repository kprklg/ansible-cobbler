name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Install collections
        run: ansible-galaxy collection install community.docker

      - name: Syntax check
        run: |
          ansible-playbook playbooks/site.yml --syntax-check
          ansible-playbook playbooks/deploy.yml --syntax-check
          ansible-playbook playbooks/rebuild.yml --syntax-check
          ansible-playbook playbooks/uninstall.yml --syntax-check

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible + linter
        run: |
          pip install ansible ansible-lint
      - name: Install collections
        run: ansible-galaxy collection install community.docker
      - name: Run ansible-lint
        run: |
          ansible-lint roles/cobbler/ || true

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run yamllint
        run: |
          pip install yamllint
          yamllint -d "{rules: {line-length: {max: 200}, truthy: {allowed-values: ['true', 'false', 'yes', 'no']}}}" .

  meta:
    name: Role structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Ansible role structure
        run: |
          test -f roles/cobbler/meta/main.yml
          test -f roles/cobbler/tasks/main.yml
          test -f roles/cobbler/defaults/main.yml
          test -f roles/cobbler/README.md
          test -f roles/cobbler/LICENSE
          echo "✓ Role structure valid"
