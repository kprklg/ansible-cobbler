---
name: docker-publish

# Публикует Docker-образ в GitHub Container Registry (ghcr.io) при пуше тега.
# Результат: ghcr.io/kprklg/ansible-cobbler:vX.Y.Z
#
# Для тестовых сборок используется .dockerhub-cache через buildx.

'on':
  push:
    tags: ['v*.*.*']
  workflow_dispatch:    # можно запустить вручную

permissions:
  contents: read
  packages: write       # для push в ghcr.io

jobs:
  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          VERSION="${VERSION%%-*}"  # strip -rc suffix
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/kprklg/ansible-cobbler:${{ steps.version.outputs.version }}
            ghcr.io/kprklg/ansible-cobbler:latest
          labels: |
            org.opencontainers.image.title=ansible-cobbler
            org.opencontainers.image.description=Ansible role runner for PXE provisioning server Cobbler 4.x
            org.opencontainers.image.source=https://github.com/kprklg/ansible-cobbler
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
