name: mkdocs

# Собирает сайт документации (mkdocs) и проверяет, что нет ошибок.
# Раньше этот workflow деплоил на GitHub Pages через
# actions/deploy-pages@v4, но Pages не включён в настройках
# репозитория, что приводило к ошибке:
#   "Get Pages site failed. ... Not Found"
# Теперь workflow только собирает документацию и сохраняет артефакт.
# Включить Pages и deploy: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-mkdocs-${{ hashFiles('mkdocs.yml') }}
          restore-keys: ${{ runner.os }}-mkdocs-

      - name: Install mkdocs + material
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            mkdocs \
            mkdocs-material \
            pymdown-extensions \
            mdx_truly_sane_lists

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
