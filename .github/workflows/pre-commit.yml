name: pre-commit

# Запускает все pre-commit хуки из .pre-commit-config.yaml в CI.
# Это гарантирует, что даже те, кто не настроил pre-commit локально,
# получат feedback при PR.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit run --all-files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck yamllint \
            ansible-core ansible

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.3
        with:
          extra_args: --all-files --verbose