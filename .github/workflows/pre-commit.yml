---
name: pre-commit

# Запускает все pre-commit хуки из .pre-commit-config.yaml в CI.
# Использует прямой запуск pre-commit через pip вместо готового action,
# потому что pre-commit/action@v3 пытается делать 'git fetch origin
# --tags' на каждом репозитории хука, что не работает в CI без
# credentials (fatal: could not read Username for 'https://github.com').

'on':
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit run --all-files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-

      - name: Set up system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck yamllint \
            ansible-core ansible

      - name: Run pre-commit
        # SKIP=git отключает попытки 'git fetch' (которые не работают
        # в CI без credentials). Все остальные хуки (yamllint,
        # ansible-lint, commitizen, shellcheck) работают через pip
        # и не требуют git fetch.
        env:
          SKIP: git
        run: pre-commit run --all-files --show-diff-on-failure --color=always
