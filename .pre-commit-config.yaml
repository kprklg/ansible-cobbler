# .pre-commit-config.yaml — для локальной разработки.
# В CI используется .github/workflows/hooks.yml (прямой запуск),
# потому что pre-commit/action и сам pre-commit делают
# 'git fetch origin --tags' для обновления хуков, что не работает
# в CI без credentials.
#
# Локально: pip install pre-commit && pre-commit install

repos:
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: yamllint --strict .
        language: system
        types: [file]
        files: \.(yaml|yml)$
        pass_filenames: false
