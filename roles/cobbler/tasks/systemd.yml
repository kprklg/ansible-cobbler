---
# tasks/systemd.yml — установка systemd-сервиса автозапуска
#
# NB: include_tasks не пробрасывает теги на inner-tasks, поэтому
# каждой задаче проставлены tags: [systemd, autostart] явно.
# Иначе `ansible-playbook --tags systemd` ничего не сделает (см. PR #v1.1.2).

- name: "Генерация cobbler-recover.sh"
  ansible.builtin.template:
    src: cobbler-recover.sh.j2
    dest: "{{ cobbler_workdir }}/cobbler-recover.sh"
    mode: "0755"
  tags:
    - systemd
    - autostart

- name: "Создание systemd-юнита {{ cobbler_systemd_service_name }}.service"
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ cobbler_systemd_service_name }}.service"
    content: |
      [Unit]
      Description=Cobbler stack autostart (universal playbook)
      After=network-online.target docker.service
      Wants=network-online.target
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart={{ cobbler_workdir }}/cobbler-recover.sh
      WorkingDirectory={{ cobbler_workdir }}
      TimeoutStartSec={{ cobbler_systemd_timeout }}

      [Install]
      WantedBy=multi-user.target
  tags:
    - systemd
    - autostart

- name: "daemon-reload + enable {{ cobbler_systemd_service_name }}"
  ansible.builtin.systemd:
    name: "{{ cobbler_systemd_service_name }}.service"
    enabled: yes
    daemon_reload: yes
  tags:
    - systemd
    - autostart